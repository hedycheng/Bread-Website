{{ define "main" }}
<section class="hero">
  <h1>{{ site.Title }}</h1>
  <p>{{ site.Params.description }}</p>
</section>

{{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}

<section>
  <h2 class="section-title">最新文章</h2>
  {{ $posts := where site.RegularPages "Section" "ne" "" }}
  {{ partial "post-list.html" (first 10 $posts.ByDate.Reverse) }}
</section>
{{ end }}
