<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ "" | relURL }}">{{ site.Title }}</a>
    <nav aria-label="主選單">
      <ul>
        {{ $current := . }}
        {{ range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $current.HasMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
