{{/* 文章列表：傳入頁面集合 */}}
<ul class="post-list">
  {{ range . }}
  <li>
    <article>
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      {{ partial "meta.html" . }}
      <p class="summary">{{ with .Params.summary }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 90 }}{{ end }}</p>
    </article>
  </li>
  {{ else }}
  <li class="empty">還沒有文章。</li>
  {{ end }}
</ul>
