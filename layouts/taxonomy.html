{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
</header>
<ul class="tag-cloud">
  {{ range .Data.Terms.Alphabetical }}
  <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span>{{ .Count }}</span></a></li>
  {{ else }}
  <li class="empty">還沒有標籤。</li>
  {{ end }}
</ul>
{{ end }}
