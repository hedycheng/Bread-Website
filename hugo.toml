# ─────────────────────────────────────────────
#  網站基本設定（改這裡就能換名稱、說明）
# ─────────────────────────────────────────────
title = "Bread's Tribe 麵包部落"

# 部署到 GitHub Pages 時，GitHub Actions 會自動帶入正確網址，這裡可以不用改。
# 之後綁自訂網域時，再把它改成你的網域，例如 "https://example.com/"
baseURL = "https://example.com/"

locale = "zh-TW"
defaultContentLanguage = "zh-tw"
hasCJKLanguage = true          # 中文字數、摘要計算需要
summaryLength = 60
enableRobotsTXT = true
buildFuture = true            # 日期晚於「現在」的文章也照常顯示（避免時區差造成文章消失）

[pagination]
  pagerSize = 12

# 標籤、書名、地點都會自動產生索引頁（網址：/tags/、/book/、/place/）
[taxonomies]
  tag = "tags"
  book = "book"
  place = "place"

# 指南文章的「最後更新」日期：在筆記屬性寫 updated: 2026-11-19
[frontmatter]
  lastmod = ["updated", "lastmod", "date"]

[params]
  description = "定期分享書摘，以及零碎但可能對你有幫助的想法"
  author = "Bread Cheng"

# ─────────────────────────────────────────────
#  導覽列
# ─────────────────────────────────────────────
[[menus.main]]
  name = "閱讀"
  pageRef = "/reading"
  weight = 10

[[menus.main]]
  name = "遊記"
  pageRef = "/travel"
  weight = 20

[[menus.main]]
  name = "隨筆"
  pageRef = "/essays"
  weight = 30

[[menus.main]]
  name = "指南"
  pageRef = "/guides"
  weight = 40

[[menus.main]]
  name = "關於"
  pageRef = "/about"
  weight = 50

# ─────────────────────────────────────────────
#  Markdown 設定
# ─────────────────────────────────────────────
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true            # 允許 <mark>（Obsidian 的 ==螢光標記==）
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        disable = true         # 避免中文引號被自動替換
  [markup.highlight]
    noClasses = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
